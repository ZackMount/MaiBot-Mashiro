name: Mashiro regression

on:
  push:
    branches: [mashiro]
  pull_request:
    branches: [mashiro]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-and-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install project dependencies
        run: uv sync --group dev
      - name: Run synthetic context and tool regressions
        run: >-
          uv run pytest -q
          pytests/mashiro
          pytests/maisaka/test_planner_messages.py
          pytests/maisaka/test_replyer_history_filter.py
          pytests/A_memorix_test/test_summary_identity.py
